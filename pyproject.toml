[project]
name = "vizag-geoai"
version = "0.1.0"
description = "Explainable Multimodal GeoAI for Urban Expansion & Infrastructure Pressure Prediction — Visakhapatnam"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    # NOTE on version pins: the geospatial stack (rasterio/geopandas/rioxarray)
    # now requires numpy>=2, which forced upgrading scikit-learn/matplotlib/
    # pandas/xgboost/lightgbm/shap/osmnx/pysal together to numpy2-compatible
    # majors during Part 0.4 — see tracking/bugs_and_fixes.md. Pins below
    # reflect the actual tested-compatible set, not the original Part 0.1
    # guesses.
    "numpy>=2.0,<3.0",
    "pandas>=2.3,<3.0",
    "geopandas>=1.2,<2.0",
    "shapely>=2.2,<3.0",
    "pyproj>=3.8,<4.0",
    "rasterio>=1.5,<2.0",
    "rioxarray>=0.23,<1.0",
    "xarray>=2026.1,<2027.0",
    "scikit-learn>=1.9,<2.0",
    "xgboost>=2.1,<3.0",
    "lightgbm>=4.7,<5.0",
    "shap>=0.53,<1.0",
    "osmnx>=2.1,<3.0",
    "pysal>=26.0,<27.0",
    "matplotlib>=3.11,<4.0",
    "pyyaml>=6.0,<7.0",
    # Part 0.4 additions: storage-tier tooling (Section 1A)
    "dask>=2026.1,<2027.0",
    "pyarrow>=26.0,<27.0",
    "rio-cogeo>=7.0,<8.0",
    "boto3>=1.43,<2.0",
    "python-dotenv>=1.0,<2.0",
    # Part 2.2: computes real Sentinel-2 MGRS tile intersection, not assumed
    "mgrs>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
