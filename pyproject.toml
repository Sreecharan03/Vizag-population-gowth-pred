[project]
name = "vizag-geoai"
version = "0.1.0"
description = "Explainable Multimodal GeoAI for Urban Expansion & Infrastructure Pressure Prediction — Visakhapatnam"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<3.0",
    "geopandas>=0.14,<1.0",
    "shapely>=2.0,<3.0",
    "pyproj>=3.6,<4.0",
    "rasterio>=1.3,<2.0",
    "rioxarray>=0.15,<1.0",
    "xarray>=2024.1,<2025.0",
    "scikit-learn>=1.4,<2.0",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.3,<5.0",
    "shap>=0.45,<1.0",
    "osmnx>=1.9,<2.0",
    "pysal>=24.1,<25.0",
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
