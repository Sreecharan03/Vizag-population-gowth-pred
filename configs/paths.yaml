  data_requirements: configs/data_requirements.yaml
  compute: configs/compute.yaml
  preprocessing: configs/preprocessing.yaml
  archive: configs/archive.yaml
  archive_publication: configs/archive_publication.yaml
  gate_review: configs/gate_review.yaml
  feature_aggregation: configs/feature_aggregation.yaml
  grid_build: configs/grid_build.yaml
  feature_preflight: configs/feature_preflight.yaml
  dem_validation: configs/dem_validation.yaml
  context_preflight: configs/context_preflight.yaml
  context_validation: configs/context_validation.yaml
  worldpop_acquisition: configs/worldpop_acquisition.yaml
  worldpop_batch: configs/worldpop_batch.yaml
  osm_history_probe: configs/osm_history_probe.yaml
  osm_history_batch: configs/osm_history_batch.yaml
  context_aggregation: configs/context_aggregation.yaml
  feature_assembly: configs/feature_assembly.yaml
  built_up_preflight: configs/built_up_preflight.yaml

