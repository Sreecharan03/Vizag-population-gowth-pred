# Backblaze B2 connection config. NO secrets in this file — credentials come
# only from env vars (Lightning Studio secrets, or a local gitignored .env):
# Backbaze-keyID, Backbaze-applicationKey (see src/utils/env_check.py).
#
# NOTE on naming: plan.md's Section 1A.5 skeleton used placeholder names
# (B2_KEY_ID/B2_APP_KEY); this project's actual .env uses the names above
# instead — documented here and in tracking/open_questions.md so it isn't
# lost. BUCKET-ID and Backbaze-keyName also exist in .env but are unused by
# this project: BUCKET-ID holds B2's internal bucket ID (not the S3 API's
# required bucket *name*, which is set directly below instead), and
# Backbaze-keyName is just an informational label.

endpoint_url: https://s3.us-east-005.backblazeb2.com
bucket: satilliate-images

# Mapped from Phase 2 Part 2.1's real full-bucket inventory (2026-10-10,
# results/phase2/inventory_report.md): 1,474 objects, 205.85 GB, all under
# a "vizag-geoai/" root.
prefixes:
  raw_sentinel2: vizag-geoai/data/raw/sentinel2/      # 280 .SAFE.zip archives, 182.82 GB, confirmed (Assumption A1/A4)
  raw_other: vizag-geoai/data/raw/                     # e.g. WorldPop rasters already live at raw/worldpop/ within this
  # The prefixes below are intentionally still null: this bucket already has
  # a "vizag-geoai/data/processed/sentinel2/" prefix with LEGACY processed
  # outputs from prior work (840 per-scene derivatives + 346 mosaics — not
  # produced by this codebase's Phase 3, which doesn't exist yet). Whether
  # our own Tier 3 backup reuses that prefix or uses a new one is a Phase 3
  # Part 3.0 design decision, not decided yet — do not guess it here.
  processed_backup: null
  manifests_backup: null
