# Source of truth for the GVMC study boundary. Fetched from OpenStreetMap
# (Nominatim) — never estimated or fabricated, per project rule: all
# Visakhapatnam geographic data must come from a verified source.

source:
  provider: openstreetmap_nominatim
  query: "Greater Visakhapatnam Municipal Corporation, Andhra Pradesh, India"
  # Filled in automatically after a successful fetch (src/acquisition/boundary.py)
  # so the exact OSM entity used is recorded, not just the query string.
  # Recorded from the real Part 1.1 run (2026-10-10). Cross-checked against
  # the boundary file already present in B2 (vizag-geoai/data/boundaries/
  # gvmc_boundary.geojson): IoU = 1.0, exact area match (625.15 km²) — the
  # existing file is geometrically identical to this verified OSM fetch.
  retrieved_osm_type: relation
  retrieved_osm_id: 17493324
  retrieved_display_name: "Visakhapatnam, Visakhapatnam Urban, Visakhapatnam, Andhra Pradesh, India"
  retrieved_at: "2026-10-10T18:27:20.848878+00:00"

crs: EPSG:32644

# Default buffer distance around the GVMC boundary, in meters. This is a
# reasonable starting value, not a fixed truth — the Phase 1 Gate's visual
# check (results/phase1_boundary_check.png) is where the user confirms or
# adjusts it.
buffer_distance_m: 5000

# Loose sanity bounds for the fetched (unbuffered) boundary's area, in km².
# Calibrated from a real Nominatim fetch during Part 1.1 (~625 km²) with
# generous margin — this catches "wrong entity matched" (e.g. all of Andhra
# Pradesh, or a single ward), not meant to assert one "true" area value.
sanity:
  min_area_km2: 300
  max_area_km2: 1200
