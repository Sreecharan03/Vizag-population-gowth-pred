# Studio storage budget and staging rules (Section 1A). NO secrets here.
#
# budget_gb confirmed by the user on 2026-10-10: use up to 150 GB on the
# Studio at most; everything beyond that must live in Backblaze B2 only
# (Tier 0, not counted against this budget) — exactly the Tier 2 cap this
# field is for. The storage guard (src/storage/guard.py, Part 0.5) must
# refuse any heavy operation that would push Tier 1+Tier 2 past this.
#
# Workspace facts confirmed during Part 0.4 (2026-10-10): df -h showed
# 774G total / 719G available on /teamspace/studios/this_studio at that
# time — informational only; the real constraint is the 150 GB cap below,
# not raw available disk.
studio:
  workspace_root: /teamspace/studios/this_studio
  budget_gb: 150
  warn_at_pct: 70
  hard_stop_at_pct: 90

staging:
  path: data/staging
  max_gb: 20
  max_concurrent_units: 2

tier2:
  target_max_gb: null  # set after Part 1.1 (area) and Part 3.2 (scene count)

eviction:
  require_b2_verified: true
  require_derivative_validated: true
  ledger: data/manifests/eviction_ledger.jsonl
