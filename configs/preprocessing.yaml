# Phase 3 preprocessing choices. No credentials.
triage:
  top_k_per_epoch: 8
  scl_classes:
    nodata_or_defective: [0, 1]
    shadow: [3]
    cloud_or_snow: [8, 9, 10, 11]
  # Lower unusable_fraction wins; ties are deterministic.
  score: unusable_fraction

extraction:
  contract_version: "3.3.2"
  output_crs: EPSG:32644
  pixel_size_m: 10
  grid_origin_x: 699960
  grid_origin_y: 2000040
  output_bounds: [706610, 1936220, 765270, 1990390]
  output_width: 5866
  output_height: 5417
  reflectance_dtype: float32
  reflectance_bands: [B02, B03, B04, B08, B11, B12]
  categorical_dtype: uint8
  categorical_bands: [SCL]
  separate_scl_cog: true
  reflectance_nodata: -9999.0
  preserve_out_of_range_for_qc: true

mask:
  # Conservative default: class 2 can contain topographic/dark-feature shadows.
  valid_classes: [4, 5, 6, 7]
  invalid_classes: [0, 1, 3, 8, 9, 10, 11]
  dark_class_2_valid: false
  dilate_classes: [3, 8, 9, 10, 11]
  dilation_radius_pixels: 2
  unknown_classes_invalid: true

composite:
  contract_version: "3.5.0"
  chunk_size_pixels: 512
  reflectance_nodata: -9999.0
  valid_obs_nodata: 255
  # Approved after the read-only 32-scene coverage preflight on 2026-11-06.
  # Four is the strongest common threshold retaining at least 99% AOI coverage
  # in every epoch; five would reduce 2024 coverage to 45.8736%.
  min_valid_observations: 4
  min_aoi_coverage_fraction: 0.99

indices:
  contract_version: "3.6.0"
  source_composite_contract: "3.5.0"
  # Frozen by the independent Part 3.5 byte-stream audit.
  source_composite_sha256:
    2018: "995ea0d48d95f803b9e4f22694b16a6451e1f3b2605ada292765dd00a2a30d3f"
    2020: "8c6113e09f59456292ba742d1a97bcfd3581524d8ac2502935d9fb9d3d331dc7"
    2022: "f8a7db985126f1c4e0acf18f9d52e338b656c1b7e76ffdde6311d72cc89e5404"
    2024: "55fa556063dc14d8f3bd221e153d90bd302277fc9a59f5179a4dbf07ff8d9395"
  names: [ndvi, ndbi, ndwi, mndwi, bsi]
  chunk_size_pixels: 512
  output_dtype: float32
  output_nodata: -9999.0
  # In reflectance units. Guard cancellation and zero denominators; no clipping.
  denominator_epsilon: 0.000001
  nominal_range: [-1.0, 1.0]
  range_tolerance: 0.000001
  preserve_out_of_range_for_qc: true
  formulas:
    ndvi: "(B08 - B04) / (B08 + B04)"
    ndbi: "(B11 - B08) / (B11 + B08)"
    # McFeeters-style open-water NDWI, not NIR/SWIR moisture NDWI.
    ndwi: "(B03 - B08) / (B03 + B08)"
    mndwi: "(B03 - B11) / (B03 + B11)"
    bsi: "((B11 + B04) - (B08 + B02)) / ((B11 + B04) + (B08 + B02))"
